name: Verify sagas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '26.0.2'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: chmod +x gradlew
      - run: docker compose up -d --wait postgres kafka
      - run: ./gradlew test integrationTest bootJar --no-daemon
      - run: docker compose up -d --build --wait
      - run: node scripts/scenarios.mjs
      - run: node scripts/resilience.mjs --poison-only
      - run: node scripts/resilience.mjs
      - name: Save diagnostics
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            compose.log
      - if: always()
        run: docker compose down -v
